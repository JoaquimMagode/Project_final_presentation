name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─────────────────────────────────────────
  # Backend — install deps & run tests
  # ─────────────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      # Database — override with real secrets in repo Settings → Secrets
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: imap_solution_db
      DATABASE_URL: mysql://root:root@localhost:3306/imap_solution_db
      # Auth
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE: 7d
      # Email (stubbed in CI — nodemailer won't actually send)
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: 587
      EMAIL_USER: ci@example.com
      EMAIL_PASS: placeholder
      # Uploads
      MAX_FILE_SIZE: 5242880
      UPLOAD_PATH: uploads

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: imap_solution_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: App/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: App/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ─────────────────────────────────────────
  # Frontend — install deps & build
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (Vite / React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: App/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: App/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: App/frontend/dist
          retention-days: 7
